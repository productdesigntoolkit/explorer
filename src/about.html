<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="icon" href="{{FAVICON}}" type="image/png">
{{THEME_INIT}}
  {{FONT_LINK}}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
{{TOKENS}}
    body { font-family: var(--font); background: var(--bg); color: var(--text); transition: background-color .2s, color .2s; }

    .theme-switch {
      display: flex; align-items: center; gap: 2px; padding: 3px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      margin-left: 6px; flex-shrink: 0;
    }
    .theme-option {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 5px; border: none;
      background: none; color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .theme-option svg { width: 14px; height: 14px; }
    .theme-option:hover { color: var(--text); }
    .theme-option.active { background: var(--white); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

    header {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .logo span { font-weight: 300; color: var(--text-muted); }
    .header-nav { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      padding: 6px 12px; font-size: 12px; font-weight: 500;
      color: var(--text-muted); text-decoration: none;
      border-radius: 6px; transition: all .15s; white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); background: var(--bg); }
    .nav-link.active { color: var(--text); font-weight: 600; }
    .nav-link-external::after { content: ' ↗'; font-size: 10px; }

    main {
      max-width: 680px;
      margin: 64px auto;
      padding: 0 32px 80px;
    }

    .page-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 16px;
    }

    h1 {
      font-size: 36px; font-weight: 700;
      letter-spacing: -0.8px; line-height: 1.15;
      margin-bottom: 32px;
    }

    .lead {
      font-size: 17px; line-height: 1.7;
      color: var(--text); margin-bottom: 40px;
      font-weight: 400;
    }

    h2 {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px; margin-top: 40px;
    }

    p {
      font-size: 15px; line-height: 1.7;
      color: var(--text); margin-bottom: 16px;
    }

    a.text-link { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    a.text-link:hover { color: var(--text-muted); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

    .spaces {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; margin: 24px 0;
    }
    .space-chip {
      padding: 8px 10px; border-radius: 8px;
      font-size: 11px; font-weight: 600;
      text-align: center; line-height: 1.3;
    }

    .author-card {
      display: flex; gap: 20px; align-items: flex-start;
      margin-top: 16px;
    }
    .author-photo {
      width: 72px; height: 72px;
      border-radius: 50%; object-fit: cover; flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .author-info { flex: 1; }
    .author-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .author-title { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .author-info p { font-size: 14px; margin-bottom: 10px; }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      main { margin: 32px auto; padding: 0 20px 60px; }
      h1 { font-size: 28px; }
      .spaces { grid-template-columns: repeat(2, 1fr); }
    }
{{BRAND_CSS}}
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
{{HEADER_LOGO}}
  </a>
  <nav class="header-nav">
{{HEADER_EXTERNAL}}
    <a class="nav-link active" href="about.html">About</a>
    <a class="nav-link" href="plugin.html">Plugin</a>
    <a class="nav-link" href="license.html">License</a>
    <a class="nav-link" href="infografik.html">Infografik</a>
{{THEME_SWITCH}}
  </nav>
</header>

<main>
  <div class="page-label">{{ABOUT_LABEL}}</div>
  <h1>{{ABOUT_H1}}</h1>

  <p class="lead">
    {{ABOUT_LEAD}}
  </p>

  <h2>{{ABOUT_WHAT_H2}}</h2>
  <p>
    {{ABOUT_WHAT}}
  </p>

  <img
    src="https://productdesigntoolkit.gitbook.io/productdesigntoolkit-docs/~gitbook/image?url=https%3A%2F%2F3531402010-files.gitbook.io%2F%7E%2Ffiles%2Fv0%2Fb%2Fgitbook-x-prod.appspot.com%2Fo%2Fspaces%252FowdHt1Ca1wXWPCwOuR1O%252Fuploads%252F26kxFDMHKT1Ec8yLgxYB%252Fimage.png%3Falt%3Dmedia%26token%3Db282df54-94cb-48fa-b96a-d92420767586&width=300&dpr=3&quality=100&sign=c0be2bf6&sv=2"
    alt="Product Design Toolkit Framework"
    style="width:100%;display:block;margin:28px 0 0;border-radius:10px;"
  >

{{ABOUT_EXTRA}}
  <hr class="divider">

  <h2>Autor</h2>
  <div class="author-card">
    <img src="{{AUTHOR_PHOTO}}" alt="Ralph Hutter" class="author-photo">
    <div class="author-info">
      <div class="author-name">Ralph Hutter</div>
      <div class="author-title">{{AUTHOR_TITLE}}</div>
      <p>{{AUTHOR_BIO}}</p>
      {{AUTHOR_LINK}}
    </div>
  </div>
</main>

<script>
{{THEME_JS}}
{{THEME_JS_INIT}}
</script>
</body>
</html>
